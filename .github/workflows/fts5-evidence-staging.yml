name: FTS5 evidence staging

on:
  push:
    branches: [agent/fts5-candidate-audit]

permissions:
  contents: read

concurrency:
  group: fts5-evidence-staging
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUTF8: "1"

jobs:
  stage:
    name: Canonical source and installed-wheel evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact evidence Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.3
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-visuals.lock

      - name: Install the hash-locked review toolchain
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation --editable .
          python -m pip check

      - name: Stage canonical formatting
        id: format
        run: |
          python -m ruff format             src/recall_ledger/_ledger_operations.py             src/recall_ledger/storage.py             tests/test_fts5_audit.py             tests/test_cli_media.py
          python -m ruff check .
          git diff --check
          if git diff --quiet --             src/recall_ledger/_ledger_operations.py             src/recall_ledger/storage.py             tests/test_fts5_audit.py             tests/test_cli_media.py
          then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            destination="$RUNNER_TEMP/formatted-source"
            install -D -m 0644               src/recall_ledger/_ledger_operations.py               "$destination/src/recall_ledger/_ledger_operations.py"
            install -D -m 0644               src/recall_ledger/storage.py               "$destination/src/recall_ledger/storage.py"
            install -D -m 0644               tests/test_fts5_audit.py               "$destination/tests/test_fts5_audit.py"
            install -D -m 0644               tests/test_cli_media.py               "$destination/tests/test_cli_media.py"
          fi

      - name: Upload canonical source
        if: steps.format.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fts5-formatted-source-${{ github.run_id }}
          path: ${{ runner.temp }}/formatted-source/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

      - name: Install the exact visual runtime
        if: steps.format.outputs.changed == 'false'
        run: |
          mkdir "$RUNNER_TEMP/visual-wheels"
          python -m pip download             --dest "$RUNNER_TEMP/visual-wheels"             --no-deps             --only-binary=:all:             --require-hashes             -r requirements-visuals.lock
          expected="pillow-12.3.0-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl"
          actual="$(
            find "$RUNNER_TEMP/visual-wheels"               -mindepth 1 -maxdepth 1 -type f -printf '%f\n'
          )"
          test "$actual" = "$expected"
          printf '%s  %s\n'             "78cb2c6865a35ab8ff8b75fd122f6033b92a62c82801110e48ddd6c936a45d91"             "$RUNNER_TEMP/visual-wheels/$expected"             | sha256sum --check --strict -
          python -m pip install             --no-index             --no-deps             --find-links "$RUNNER_TEMP/visual-wheels"             --only-binary=:all:             --require-hashes             -r requirements-visuals.lock
          python -m pip check

      - name: Recapture source-bound installed-wheel evidence
        if: steps.format.outputs.changed == 'false'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python tools/capture_cli_evidence.py             --source-commit "$GITHUB_SHA"             --write
          python tools/render_cli_evidence.py --write
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(
            printf '%s\n'               docs/visuals/evidence/installed-wheel-cli.v1.json               docs/visuals/installed-wheel-history-tombstone.svg               docs/visuals/installed-wheel-write-replay.svg
          )"
          test "$actual" = "$expected"

      - name: Render and verify the installed-wheel media bundle
        if: steps.format.outputs.changed == 'false'
        run: |
          output="$RUNNER_TEMP/installed-wheel-media"
          mkdir "$output"
          python tools/render_cli_media.py             --write             --evidence-path docs/visuals/evidence/installed-wheel-cli.v1.json             --svg-directory docs/visuals             --output-directory "$output"
          python tools/render_cli_media.py             --check             --evidence-path docs/visuals/evidence/installed-wheel-cli.v1.json             --svg-directory docs/visuals             --output-directory "$output"
          test "$(find "$output" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 6
          test -z "$(find "$output" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"

      - name: Upload installed-wheel evidence
        if: steps.format.outputs.changed == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fts5-installed-wheel-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/installed-wheel-media/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false
