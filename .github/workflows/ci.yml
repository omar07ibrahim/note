name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUTF8: "1"

jobs:
  verify:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - name: Check out the complete evidence history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install the hash-locked review toolchain
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation --editable .
          python -m pip check

      - name: Check lint, formatting, and strict types
        if: matrix.python == '3.11'
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src tests tools

      - name: Validate the frozen lexical evaluation
        run: python tools/lexical_eval_contract.py

      - name: Check source-bound visual evidence
        run: |
          python tools/render_visuals.py --check
          python tools/render_cli_evidence.py --check

      - name: Recapture evidence across the compatible Python runtime
        if: matrix.python == '3.12'
        run: python tools/capture_cli_evidence.py --check-portable-runtime

      - name: Run the full branch-coverage and packaging suite
        run: python -m pytest

      - name: Require a clean generated-artifact boundary
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
