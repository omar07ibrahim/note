name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUTF8: "1"

jobs:
  verify:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - name: Check out the complete evidence history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install the hash-locked review toolchain
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation --editable .
          python -m pip check

      - name: Check lint, formatting, and strict types
        if: matrix.python == '3.11'
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src tests tools

      - name: Validate the frozen lexical evaluation
        run: python tools/lexical_eval_contract.py

      - name: Check source-bound visual evidence
        run: |
          python tools/render_visuals.py --check
          python tools/render_cli_evidence.py --check
          python tools/render_lexical_eval_visuals.py --check

      - name: Recapture evidence across the compatible Python runtime
        id: portable_evidence
        if: matrix.python == '3.12'
        run: python tools/capture_cli_evidence.py --check-portable-runtime

      - name: Report bounded portable evidence difference paths
        if: ${{ failure() && matrix.python == '3.12' && steps.portable_evidence.outcome == 'failure' }}
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys

          from tools import capture_cli_evidence as capture
          from tools import cli_evidence_contract as contract

          MAX_PATHS = 16
          MAX_PATH_BYTES = 192
          MAX_OUTPUT_BYTES = 4096


          def json_pointer(parts):
              encoded = "/" + "/".join(
                  str(part).replace("~", "~0").replace("/", "~1") for part in parts
              )
              if len(encoded.encode("ascii")) > MAX_PATH_BYTES:
                  return "/<path-exceeds-safe-bound>"
              return encoded


          def differing_paths(left, right, parts=()):
              if type(left) is not type(right):
                  yield parts
                  return
              if isinstance(left, dict):
                  for key in sorted(left.keys() | right.keys()):
                      child = (*parts, key)
                      if key not in left or key not in right:
                          yield child
                      else:
                          yield from differing_paths(left[key], right[key], child)
                  return
              if isinstance(left, list):
                  if len(left) != len(right):
                      yield (*parts, "<length>")
                  for index, (left_item, right_item) in enumerate(zip(left, right)):
                      yield from differing_paths(
                          left_item,
                          right_item,
                          (*parts, index),
                      )
                  return
              if left != right:
                  yield parts


          try:
              committed_raw = capture._read_committed_evidence()
              committed = contract.decode_evidence_bytes(committed_raw)
              capture._check_current_inputs(committed)
              source_commit = capture._source_commit_from_evidence(committed_raw)
              recaptured_raw = capture.capture_evidence(capture.ROOT, source_commit)
              recaptured = contract.decode_evidence_bytes(recaptured_raw)
              if capture._portable_python_series(
                  committed,
                  context="committed evidence",
              ) != capture._portable_python_series(
                  recaptured,
                  context="recaptured evidence",
              ):
                  raise RuntimeError("incompatible Python series")
              committed = capture._mask_portable_runtime_provenance(committed)
              recaptured = capture._mask_portable_runtime_provenance(recaptured)
              paths = []
              for parts in differing_paths(committed, recaptured):
                  if len(paths) == MAX_PATHS:
                      paths[-1] = "/<additional-paths-omitted>"
                      break
                  paths.append(json_pointer(parts))
              payload = json.dumps(paths, ensure_ascii=True, separators=(",", ":"))
              if len(payload.encode("ascii")) > MAX_OUTPUT_BYTES:
                  payload = '["/<diagnostic-output-exceeds-safe-bound>"]'
              print(payload)
          except Exception:  # Diagnostic output must never expose evidence values.
              print('["/<portable-path-diagnostic-unavailable>"]')
              sys.exit(0)
          PY

      - name: Run the full branch-coverage and packaging suite
        run: python -m pytest

      - name: Require a clean generated-artifact boundary
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
