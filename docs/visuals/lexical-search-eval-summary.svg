  <rect x="60" y="575" width="1880" height="132" rx="16" fill="#fff0e4" stroke="#9c4813" stroke-width="2"/>
  <text x="88" y="615" fill="#9c4813" font-family="system-ui, sans-serif" font-size="18" font-weight="750">Known semantic miss · disclosed, not hidden</text>
  <text class="body" x="88" y="651">“remove note” returned 0 lexical hits although tombstone-boundary is judged g3 relevant.</text>
  <text class="small" x="88" y="682">RecallLedger makes no semantic-retrieval claim; macro Recall, MRR, and nDCG co-move here and are not independent evidence.</text>
