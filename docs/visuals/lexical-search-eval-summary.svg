  <title id="lexical-search-eval-summary-title">Frozen lexical evaluation scorecard</title>
  <desc id="lexical-search-eval-summary-description">Seven exact KPI cards from the validated twelve-query synthetic conformance suite, including one disclosed semantic miss.</desc>
  <style>
    .title { fill: #182536; font: 700 34px system-ui, sans-serif; }
    .subtitle { fill: #405166; font: 500 17px system-ui, sans-serif; }
    .body { fill: #182536; font: 500 15px system-ui, sans-serif; }
    .small { fill: #526276; font: 500 13px system-ui, sans-serif; }
    .mono { fill: #526276; font: 500 12px ui-monospace, monospace; }
  </style>
  <rect width="2000" height="900" fill="#f7f9fc"/>
  <text class="title" x="60" y="58">Frozen lexical evaluation · v1</text>
  <text class="subtitle" x="60" y="91">12 queries · 8 synthetic documents · exact fractions and fixed-point percentages · no cross-metric bars</text>
  <text class="small" x="60" y="121">A conformance scorecard, not a semantic quality, production traffic, or latency benchmark.</text>
