    .terminal-text, .command, .stdout, .stderr, .exit, .exit-error { font: 500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .command { fill: #d7f9ef; font-weight: 700; }
    .stdout { fill: #e6edf7; }
    .stderr { fill: #ffc9cf; }
    .exit { fill: #8ee6b7; font-weight: 700; }
    .exit-error { fill: #ff9fab; font-weight: 700; }
