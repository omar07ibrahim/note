  <title id="installed-wheel-write-replay-title">Installed wheel · write, replay, and conflict</title>
  <desc id="installed-wheel-write-replay-description">Installed wheel · write, replay, and conflict. A deterministic terminal rendering of normalized structured records captured from the installed RecallLedger wheel. Captured from an installed wheel; only run-specific note ID, event digests, microsecond timestamps, and temporary paths are normalized.</desc>
