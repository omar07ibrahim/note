<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1212" viewBox="0 0 1600 1212" role="img" aria-labelledby="installed-wheel-history-tombstone-title installed-wheel-history-tombstone-description">
  <title id="installed-wheel-history-tombstone-title">Installed wheel · paging and logical deletion</title>
  <desc id="installed-wheel-history-tombstone-description">Installed wheel · paging and logical deletion. A deterministic terminal rendering of normalized structured records captured from the installed RecallLedger wheel. Captured from an installed wheel; only run-specific note ID, event digests, microsecond timestamps, and temporary paths are normalized.</desc>
  <style>
    .title { fill: #142033; font: 700 32px system-ui, sans-serif; }
    .subtitle { fill: #405166; font: 500 17px system-ui, sans-serif; }
    .provenance { fill: #526276; font: 500 13px ui-monospace, monospace; }
    .terminal-text, .command, .stdout, .stderr, .exit, .exit-error { font: 500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .command { fill: #d7f9ef; font-weight: 700; }
    .stdout { fill: #e6edf7; }
    .stderr { fill: #ffc9cf; }
    .exit { fill: #8ee6b7; font-weight: 700; }
    .exit-error { fill: #ff9fab; font-weight: 700; }
    .caption { fill: #405166; font: 500 13px system-ui, sans-serif; }
  </style>
  <rect width="1600" height="1212" fill="#f7f9fc"/>
  <text class="title" x="48" y="54">Installed wheel · paging and logical deletion</text>
